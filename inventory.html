<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - 805 Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // SATPAM KEAMANAN: Cek apakah user benar-benar Inventory (Level 3)
        const session = JSON.parse(localStorage.getItem('session_805'));
        if (!session || session.level != 3) {
            alert("Akses ditolak! Area khusus Inventory.");
            window.location.href = "index.html";
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col" onload="muatDataInventory()">

    <!-- Header / Navbar Inventory -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-extrabold text-cyan-400">805 Mart - Inventory & Gudang</h1>
            <p class="text-sm text-gray-300">Petugas Bertugas: <span id="inventoryNama" class="font-semibold text-white"></span></p>
        </div>
        <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-xl text-sm font-semibold transition">
            Keluar
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Kolom Kiri: Form Input / Scan Barcode -->
        <div class="bg-gray-800/50 backdrop-blur border border-gray-700 p-6 rounded-2xl flex flex-col">
            <h2 class="text-lg font-semibold text-cyan-300 mb-2">Input / Scan Barang Masuk</h2>
            <p class="text-xs text-gray-400 mb-4">Arahkan scanner ke barcode produk. Jika rusak, ketik manual.</p>
            
            <form onsubmit="tambahBarangMasuk(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Scan Barcode / Kode SKU</label>
                    <input type="text" id="kodeBarang" required placeholder="Scan barcode di sini..." 
                        onchange="cekBarcodeOtomatis(this.value)"
                        class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-cyan-500/50 focus:outline-none focus:border-cyan-400 text-white font-mono text-cyan-300">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Nama Barang</label>
                    <input type="text" id="namaBarang" required placeholder="Nama Produk..." 
                        class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:border-cyan-400 text-white">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Jumlah Masuk</label>
                        <input type="number" id="jumlahMasuk" required min="1" placeholder="0" 
                            class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:border-cyan-400 text-white">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Min. Stok (Warning)</label>
                        <input type="number" id="minStok" required min="1" placeholder="5" 
                            class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:border-cyan-400 text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Harga Jual (Rp)</label>
                    <input type="number" id="hargaJual" required placeholder="0" 
                        class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:border-cyan-400 text-white">
                </div>

                <button type="submit" id="btnSimpan" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold rounded-xl transition shadow-lg shadow-cyan-500/20">
                    Simpan / Perbarui Stok
                </button>
            </form>
        </div>

        <!-- Kolom Tengah & Kanan: Monitoring Stok & Pemberitahuan Sisa -->
        <div class="lg:col-span-2 bg-gray-800/50 backdrop-blur border border-gray-700 p-6 rounded-2xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-cyan-300">Monitoring Stok Gudang & Peringatan</h2>
                <button onclick="muatDataInventory()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-semibold">🔄 Refresh Data</button>
            </div>
            
            <div class="flex-1 overflow-x-auto max-h-[500px] overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-gray-800 z-10">
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="py-3 px-2">Barcode</th>
                            <th class="py-3 px-2">Nama Barang</th>
                            <th class="py-3 px-2">Harga Jual</th>
                            <th class="py-3 px-2">Stok Sisa</th>
                            <th class="py-3 px-2">Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <tr class="border-b border-gray-800 text-sm">
                            <td colspan="5" class="py-4 text-center text-gray-400">Memuat data inventaris...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzN0S2DBKt7SimnjNdXx3WhHrK1wtRahpl7U3SjTazGwoSB69wfl-18qX7sdzZfDkMZzg/exec";

        // Inisialisasi Nama Petugas Inventory
        document.getElementById('inventoryNama').innerText = session.nama;
        let cacheProducts = [];

        function logout() {
            localStorage.removeItem('session_805');
            window.location.href = "index.html";
        }

        // Ambil data inventory dari Google Sheets via GAS
        async function muatDataInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">Memuat data dari server...</td></tr>`;

            try {
                let response = await fetch(`${GAS_URL}?action=getInventory`);
                let result = await response.json();

                if (result.status === "success") {
                    tbody.innerHTML = "";
                    cacheProducts = result.data;

                    if (cacheProducts.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">Belum ada data barang.</td></tr>`;
                        return;
                    }

                    cacheProducts.forEach(item => {
                        let stok = Number(item.stok);
                        let minStok = Number(item.min_stok);
                        let statusBadge = "";

                        if (stok <= minStok) {
                            statusBadge = `<span class="bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full text-xs font-bold border border-red-500/30">⚠️ Stok Menipis</span>`;
                        } else {
                            statusBadge = `<span class="bg-green-500/20 text-green-400 px-2.5 py-1 rounded-full text-xs font-bold border border-green-500/30">Aman</span>`;
                        }

                        tbody.innerHTML += `
                            <tr class="border-b border-gray-800 text-sm hover:bg-gray-900/30 transition">
                                <td class="py-3 px-2 font-mono text-cyan-300">${item.kode_barang}</td>
                                <td class="py-3 px-2 font-medium">${item.nama_barang}</td>
                                <td class="py-3 px-2">Rp ${Number(item.harga_jual).toLocaleString()}</td>
                                <td class="py-3 px-2 font-bold ${stok <= minStok ? 'text-red-400' : 'text-white'}">${stok}</td>
                                <td class="py-3 px-2">${statusBadge}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-400">Gagal memuat data produk.</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-400">Kesalahan koneksi server.</td></tr>`;
            }
        }

        // Fungsi Otomatis saat Barcode di-scan atau diketik
        function cekBarcodeOtomatis(kode) {
            kode = kode.trim();
            if (!kode) return;

            let found = cacheProducts.find(p => p.kode_barang === kode);
            if (found) {
                // Jika produk sudah ada, auto-fill untuk restock
                document.getElementById('namaBarang').value = found.nama_barang;
                document.getElementById('hargaJual').value = found.harga_jual;
                document.getElementById('minStok').value = found.min_stok;
                document.getElementById('jumlahMasuk').focus();
            } else {
                // Jika produk baru, kosongkan form agar bisa diisi barang baru
                document.getElementById('namaBarang').value = '';
                document.getElementById('hargaJual').value = '';
                document.getElementById('minStok').value = '5';
                document.getElementById('namaBarang').focus();
            }
        }

        async function tambahBarangMasuk(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            btn.disabled = true;
            btn.innerText = "Menyimpan...";
            
            const payload = {
                action: "addProduct",
                kode_barang: document.getElementById('kodeBarang').value.trim(),
                nama_barang: document.getElementById('namaBarang').value.trim(),
                jumlah_masuk: Number(document.getElementById('jumlahMasuk').value),
                min_stok: Number(document.getElementById('minStok').value),
                harga_jual: Number(document.getElementById('hargaJual').value)
            };

            try {
                let response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                let result = await response.json();

                if (result.status === "success") {
                    alert("Stok barang berhasil diperbarui!");
                    document.getElementById('kodeBarang').value = '';
                    document.getElementById('namaBarang').value = '';
                    document.getElementById('jumlahMasuk').value = '';
                    document.getElementById('minStok').value = '';
                    document.getElementById('hargaJual').value = '';
                    document.getElementById('kodeBarang').focus();
                    muatDataInventory();
                } else {
                    alert("Gagal: " + result.message);
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi server.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan / Perbarui Stok";
            }
        }
    </script>
</body>
</html>
