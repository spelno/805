<script>
    // Cek Sesi Keamanan
    const session = JSON.parse(localStorage.getItem('session_805'));

    // Jika tidak ada sesi atau level bukan Owner (1), tendang keluar!
    if (!session || session.level != 1) {
        alert("Akses ditolak! Anda harus login sebagai Owner.");
        window.location.href = "index.html";
    } else {
        // Tampilkan nama atau foto profil owner di elemen tertentu jika mau
        console.log("Selamat datang, " + session.nama);
    }

    // Fungsi Logout
    function logout() {
        localStorage.removeItem('session_805');
        window.location.href = "index.html";
    }
</script>
