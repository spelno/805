<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ritel Express POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-red-600 text-slate-800 h-screen flex flex-col justify-center items-center p-4 antialiased">

    <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl relative border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-red-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-extrabold shadow-lg shadow-red-200 mb-3">
                <i class="fa-solid fa-store"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">RITEL EXPRESS</h1>
            <p class="text-xs text-slate-500 mt-1 font-medium">Silakan masuk sesuai hak akses akun Anda</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 tracking-wider">USERNAME</label>
                <input type="text" id="login-user" required placeholder="Contoh: kasir, inventory, owner, admin" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-medium bg-slate-50/50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 tracking-wider">PASSWORD</label>
                <input type="password" id="login-pass" required placeholder="••••••••" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-medium bg-slate-50/50">
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-red-200 transition active:scale-98 text-sm mt-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Sistem
            </button>
        </form>

        <div id="loading-text" class="hidden text-center mt-4 text-xs font-bold text-red-600 animate-pulse">
            Memverifikasi data ke Google Sheets...
        </div>

        <p class="text-[11px] text-slate-400 text-center mt-6">Sistem Kasir Ritel Berbasis Cloud Database</p>
    </div>

    <script>
        // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbyFpuLMpsmPy5HiwfpStWuzEVoGrcPoEpoy4IQhGF9iNSvTB_cO_i34IUaLWUxPNE3c/exec";

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('btn-submit');
            const loader = document.getElementById('loading-text');

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                let response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });
                let result = await response.json();

                if (result.status === "success") {
                    // Simpan sesi aktif ke browser localStorage
                    localStorage.setItem('ritel_active_user', JSON.stringify(result.user));

                    alert(`Login Berhasil! Selamat datang, ${result.user.nama_lengkap}`);

                    // Arahkan otomatis berdasarkan level role
                    let role = result.user.role;
                    if (role === 'Kasir') {
                        window.location.href = 'kasir.html';
                    } else if (role === 'Inventory') {
                        window.location.href = 'inventory.html';
                    } else if (role === 'Owner') {
                        window.location.href = 'owner.html';
                    } else if (role === 'Admin') {
                        window.location.href = 'admin.html';
                    } else {
                        alert("Role tidak dikenali sistem!");
                    }
                } else {
                    alert(result.message || "Username atau Password salah!");
                    btn.disabled = false;
                    loader.classList.add('hidden');
                }
            } catch (err) {
                console.error(err);
                alert("Gagal terhubung ke server Google Sheets. Periksa kembali URL API atau koneksi internet Anda.");
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
