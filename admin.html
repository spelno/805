<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - 805 Mart Manado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">
    
    <header class="bg-slate-900 text-white shadow-md px-6 py-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 text-white p-2.5 rounded-2xl font-extrabold text-xl shadow"><i class="fa-solid fa-screwdriver-wrench"></i></div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">PANEL ADMIN 805 MART</h1>
                <p class="text-xs text-slate-400">Manajemen Inventaris & Stok Produk</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="kasir.html" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-cash-register"></i> Buka Kasir POS
            </a>
            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition">Keluar</button>
        </div>
    </header>

    <main class="flex-1 p-6 overflow-y-auto">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm max-w-5xl mx-auto space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-extrabold text-lg text-slate-800">Daftar Inventaris Produk</h2>
                <button onclick="loadAdminProducts()" class="bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 transition">
                    <i class="fa-solid fa-rotate"></i> Muat Ulang
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-200">
                        <tr>
                            <th class="p-3">Barcode</th>
                            <th class="p-3">Nama Barang</th>
                            <th class="p-3">Harga Jual</th>
                            <th class="p-3">Stok Tersedia</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list" class="divide-y divide-slate-100">
                        <tr><td colspan="4" class="text-center py-6 text-slate-400">Menghubungkan ke Google Sheets...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwY29-01kFoIAJ_8ALwOkg7HU9vcYUGmFlrZrlUCbjTxNmjFVLXkSUZOhxcRX0pM88/exec";

        window.onload = () => { loadAdminProducts(); };

        function logout() {
            localStorage.removeItem('ritel_active_user');
            window.location.href = 'index.html';
        }

        async function loadAdminProducts() {
            try {
                let res = await fetch(`${API_URL}?action=getProducts`);
                let data = await res.json();
                const tbody = document.getElementById('admin-product-list');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">Belum ada data produk.</td></tr>`;
                    return;
                }
                data.forEach(p => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-mono font-bold text-slate-600">${p.Barcode}</td>
                            <td class="p-3 font-bold text-slate-800">${p["Nama Barang"]}</td>
                            <td class="p-3 font-bold text-red-600">Rp ${Number(p["Harga Jual"]).toLocaleString('id-ID')}</td>
                            <td class="p-3 font-bold text-slate-700">${p.Stok} Unit</td>
                        </tr>
                    `;
                });
            } catch (e) {
                document.getElementById('admin-product-list').innerHTML = `<tr><td colspan="4" class="text-center py-6 text-red-500 font-bold">Gagal memuat data dari Google Sheets. Periksa URL GAS.</td></tr>`;
            }
        }
    </script>
</body>
</html>
