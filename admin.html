<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ritel Express</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script>
        // --- PENGAMAN SESI (SECURITY GUARD) ---
        const activeUser = JSON.parse(localStorage.getItem('ritel_active_user'));
        if (!activeUser) {
            alert("Akses ditolak! Silakan login terlebih dahulu.");
            window.location.href = 'login.html';
        } else if (activeUser.role !== 'Admin') {
            alert("Anda tidak memiliki hak akses sebagai Admin!");
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col items-center justify-center p-6 antialiased">

    <div class="max-w-3xl w-full bg-white rounded-3xl p-8 shadow-2xl border border-slate-100 text-center">
        <div class="w-16 h-16 bg-red-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-extrabold shadow-lg shadow-red-200 mb-4">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">PUSAT KONTROL ADMIN</h1>
        <p class="text-slate-500 text-sm mt-1 mb-8">Selamat datang, <span id="admin-name" class="font-bold text-slate-800">Admin</span>. Pilih modul operasional yang ingin Anda akses:</p>

        <div class="grid grid-cols-3 gap-4">
            <a href="kasir.html" class="p-6 bg-red-50 hover:bg-red-100 text-red-700 rounded-2xl border border-red-100 transition flex flex-col items-center group">
                <i class="fa-solid fa-cash-register text-3xl mb-3 group-hover:scale-110 transition"></i>
                <span class="font-bold text-sm">Buka Kasir (POS)</span>
                <span class="text-xs text-red-500 mt-1">Layani transaksi</span>
            </a>
            <a href="inventory.html" class="p-6 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-2xl border border-amber-100 transition flex flex-col items-center group">
                <i class="fa-solid fa-boxes-stacked text-3xl mb-3 group-hover:scale-110 transition"></i>
                <span class="font-bold text-sm">Stok Gudang</span>
                <span class="text-xs text-amber-600 mt-1">Kelola barang & restock</span>
            </a>
            <a href="owner.html" class="p-6 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-2xl border border-emerald-100 transition flex flex-col items-center group">
                <i class="fa-solid fa-chart-line text-3xl mb-3 group-hover:scale-110 transition"></i>
                <span class="font-bold text-sm">Dashboard Owner</span>
                <span class="text-xs text-emerald-600 mt-1">Valuasi aset & laporan</span>
            </a>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
            <span>Sistem Ritel Express Terintegrasi Cloud</span>
            <button onclick="logout()" class="text-red-600 font-bold hover:underline">Keluar Akun</button>
        </div>
    </div>

    <script>
        document.getElementById('admin-name').innerText = activeUser.nama_lengkap;
        function logout() {
            localStorage.removeItem('ritel_active_user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
