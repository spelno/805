<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - 805 Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // SATPAM KEAMANAN: Cek apakah user benar-benar Kasir (Level 4)
        const session = JSON.parse(localStorage.getItem('session_805'));
        if (!session || session.level != 4) {
            alert("Akses ditolak! Area khusus Kasir.");
            window.location.href = "index.html";
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- Header / Identitas Kasir -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <!-- Foto Profil Kasir -->
            <img id="kasirFoto" src="" alt="Foto Kasir" class="w-12 h-12 rounded-full object-cover border-2 border-cyan-400">
            <div>
                <h1 class="text-xl font-bold text-cyan-400">805 Mart - Kasir POS</h1>
                <p class="text-sm text-gray-300">Kasir Bertugas: <span id="kasirNama" class="font-semibold text-white"></span></p>
            </div>
        </div>
        <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-xl text-sm font-semibold transition">
            Keluar Shift
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Kolom Kiri & Tengah: Katalog / Input Barang -->
        <div class="lg:col-span-2 bg-gray-800/50 backdrop-blur border border-gray-700 p-6 rounded-2xl flex flex-col">
            <h2 class="text-lg font-semibold mb-4 text-cyan-300">Pencarian & Input Barang</h2>
            
            <div class="flex gap-4 mb-6">
                <input type="text" id="kodeBarangInput" placeholder="Scan Barcode atau Ketik Kode Barang..." 
                    class="flex-1 px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:border-cyan-400 text-white">
                <button onclick="tambahKeKeranjang()" class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold rounded-xl transition">
                    Tambah
                </button>
            </div>

            <!-- Tabel Daftar Belanja Sementara -->
            <div class="flex-1 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="py-3 px-2">Nama Barang</th>
                            <th class="py-3 px-2">Harga</th>
                            <th class="py-3 px-2">Qty</th>
                            <th class="py-3 px-2">Subtotal</th>
                            <th class="py-3 px-2 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- Item keranjang masuk disini -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Kolom Kanan: Ringkasan Pembayaran & Eksekusi -->
        <div class="bg-gray-800/50 backdrop-blur border border-gray-700 p-6 rounded-2xl flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-4 text-cyan-300">Ringkasan Transaksi</h2>
                <div class="bg-gray-900 p-4 rounded-xl mb-6 border border-gray-700">
                    <p class="text-gray-400 text-sm">Total Belanja:</p>
                    <p id="displayTotal" class="text-3xl font-extrabold text-cyan-400 mt-1">Rp 0</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Jumlah Uang Tunai</label>
                        <input type="number" id="uangBayar" placeholder="0" oninput="hitungKembalian()"
                            class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:border-cyan-400 text-white">
                    </div>
                    <div>
                        <p class="text-sm text-gray-300">Uang Kembalian:</p>
                        <p id="displayKembalian" class="text-xl font-bold text-green-400 mt-1">Rp 0</p>
                    </div>
                </div>
            </div>

            <div class="space-y-3 mt-6">
                <button onclick="prosesPembayaran()" class="w-full py-4 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl shadow-lg transition">
                    Bayar & Cetak Nota
                </button>
                <button onclick="bukaRiwayatNota()" class="w-full py-3 bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold rounded-xl transition text-sm">
                    Riwayat / Cetak Ulang Nota
                </button>
            </div>
        </div>

    </main>

    <script>
        // Inisialisasi Identitas Kasir dari LocalStorage
        document.getElementById('kasirNama').innerText = session.nama;
        document.getElementById('kasirFoto').src = session.foto_url || 'https://via.placeholder.com/150';

        let cart = [];

        function logout() {
            localStorage.removeItem('session_805');
            window.location.href = "index.html";
        }

        function tambahKeKeranjang() {
            const kode = document.getElementById('kodeBarangInput').value.trim();
            if(!kode) return;

            // Simulasi dummy item (Nanti dihubungkan langsung dengan fungsi getInventory dari GAS)
            let existing = cart.find(item => item.kode_barang === kode);
            if(existing) {
                existing.jumlah += 1;
                existing.subtotal = existing.jumlah * existing.harga_jual;
            } else {
                cart.push({
                    kode_barang: kode,
                    nama_barang: "Produk " + kode,
                    harga_jual: 10000, // Contoh harga dummy
                    jumlah: 1,
                    subtotal: 10000
                });
            }

            document.getElementById('kodeBarangInput').value = '';
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.subtotal;
                tbody.innerHTML += `
                    <tr class="border-b border-gray-800 text-sm">
                        <td class="py-3 px-2">${item.nama_barang}</td>
                        <td class="py-3 px-2">Rp ${item.harga_jual.toLocaleString()}</td>
                        <td class="py-3 px-2">${item.jumlah}</td>
                        <td class="py-3 px-2">Rp ${item.subtotal.toLocaleString()}</td>
                        <td class="py-3 px-2 text-center">
                            <button onclick="hapusItem(${index})" class="text-red-400 hover:text-red-300 font-bold">Hapus</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('displayTotal').innerText = "Rp " + total.toLocaleString();
            hitungKembalian();
        }

        function hapusItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function hitungKembalian() {
            let total = cart.reduce((sum, item) => sum + item.subtotal, 0);
            let bayar = Number(document.getElementById('uangBayar').value) || 0;
            let kembalian = bayar - total;
            
            document.getElementById('displayKembalian').innerText = kembalian >= 0 ? "Rp " + kembalian.toLocaleString() : "Uang kurang";
        }

        async function prosesPembayaran() {
            if(cart.length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }

            let total = cart.reduce((sum, item) => sum + item.subtotal, 0);
            let bayar = Number(document.getElementById('uangBayar').value) || 0;

            if(bayar < total) {
                alert("Jumlah uang tunai kurang dari total belanja!");
                return;
            }

            // Kirim transaksi ke backend GAS
            const payload = {
                action: "addTransaction",
                id_kasir: session.id_user,
                total_harga: total,
                items: cart
            };

            const GAS_URL = "https://script.google.com/macros/s/AKfycbynWGswG834HXNGAB1bV7bvFfZgraJVShRy1Bu-fsnp6NCmGWwUQUWRtyzCFeZo-I_VMA/exec";

            try {
                let response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                let result = await response.json();

                if(result.status === "success") {
                    alert("Transaksi Berhasil! Nota: " + result.id_nota);
                    // Trigger Cash Drawer & Cetak Struk (Simulasi Window Print)
                    window.print();
                    cart = [];
                    document.getElementById('uangBayar').value = '';
                    renderCart();
                } else {
                    alert("Gagal memproses transaksi: " + result.message);
                }
            } catch(err) {
                alert("Terjadi kesalahan koneksi server.");
            }
        }

        function bukaRiwayatNota() {
            alert("Fitur Riwayat Nota & Cetak Ulang akan menampilkan daftar nota kasir untuk dicetak kembali.");
        }
    </script>
</body>
</html>
