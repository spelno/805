<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir (POS) - Ritel Express</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script>
        const activeUser = JSON.parse(localStorage.getItem('ritel_active_user'));
        if (!activeUser) {
            alert("Akses ditolak! Silakan login terlebih dahulu.");
            window.location.href = 'index.html';
        } else if (activeUser.role !== 'Kasir' && activeUser.role !== 'Admin') {
            alert("Anda tidak memiliki hak akses sebagai Kasir!");
            window.location.href = 'index.html';
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden antialiased">

    <!-- HEADER KASIR -->
    <header class="bg-red-600 text-white shadow-md px-6 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <!-- Tombol Navigasi Home / Back -->
            <button onclick="goHome()" class="bg-white/20 hover:bg-white/30 text-white w-9 h-9 rounded-xl flex items-center justify-center transition cursor-pointer" title="Kembali ke Beranda">
                <i class="fa-solid fa-house text-sm"></i>
            </button>
            <div class="bg-white text-red-600 p-2 rounded-xl font-extrabold text-xl shadow">
                <i class="fa-solid fa-cash-register"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">RITEL EXPRESS</h1>
                <p class="text-xs text-red-100 font-medium">Terminal Kasir Resmi (POS)</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="text-right">
                <p id="cashier-name" class="text-sm font-bold">Kasir</p>
                <button onclick="logout()" class="text-xs text-red-100 underline hover:text-white cursor-pointer">Keluar Akun</button>
            </div>
            <div id="cashier-initial" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold">K</div>
        </div>
    </header>

    <!-- KONTEN UTAMA KASIR -->
    <main class="flex-1 flex overflow-hidden">
        <div class="flex-1 flex flex-col p-5 bg-slate-50 overflow-hidden">
            <div class="flex gap-3 mb-4 items-center">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Cari barang atau tembak barcode fisik di sini..." 
                        class="w-full bg-white pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500 shadow-sm text-sm font-medium">
                </div>
                <button onclick="startScanner()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-md transition text-sm shrink-0 cursor-pointer">
                    <i class="fa-solid fa-camera text-base"></i> Scan Kamera HP
                </button>
            </div>

            <div id="reader-container" class="hidden mb-4 p-4 bg-white border border-slate-200 rounded-2xl shadow-lg relative max-w-sm">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-700"><i class="fa-solid fa-barcode mr-1 text-red-600"></i> Arahkan kamera ke Barcode</span>
                    <button onclick="stopScanner()" class="text-red-600 font-bold text-xs bg-red-50 px-2.5 py-1 rounded-lg cursor-pointer">Tutup</button>
                </div>
                <div id="reader" class="w-full rounded-xl overflow-hidden bg-slate-100"></div>
            </div>

            <div class="flex-1 overflow-y-auto pr-2">
                <div id="product-grid" class="grid grid-cols-3 gap-4">
                    <p class="text-slate-400 col-span-3 text-center py-12">Memuat katalog barang dari Google Sheets...</p>
                </div>
            </div>
        </div>

        <div class="w-[440px] bg-white border-l border-slate-200 flex flex-col shadow-lg z-10">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-red-50/50">
                <h2 class="font-bold text-red-600 flex items-center gap-2"><i class="fa-solid fa-cart-shopping"></i> Keranjang Belanja</h2>
                <span id="cart-count" class="bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">0 Item</span>
            </div>

            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100 max-h-[180px]">
                <p class="text-slate-400 text-center py-6 text-sm">Keranjang masih kosong.</p>
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200">
                <div class="bg-white p-3 rounded-xl border border-slate-200 mb-2 space-y-1 text-sm">
                    <div class="flex justify-between text-slate-500"><span>Total Belanja:</span><span id="display-total" class="font-bold text-slate-800">Rp 0</span></div>
                    <div class="flex justify-between text-slate-500"><span>Uang Dibayar:</span><span id="display-cash" class="font-bold text-red-600">Rp 0</span></div>
                    <div class="flex justify-between border-t border-slate-100 pt-1 text-base font-extrabold"><span class="text-slate-700">Kembalian:</span><span id="display-change" class="text-emerald-600">Rp 0</span></div>
                </div>

                <div class="flex justify-between items-center text-xs text-slate-500 px-1 mb-1">
                    <span>Keypad Kalkulator Tunai</span>
                    <span id="numpad-display" class="font-mono font-bold text-red-600 text-sm">0</span>
                </div>
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="pressNumpad('7')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">7</button>
                    <button onclick="pressNumpad('8')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">8</button>
                    <button onclick="pressNumpad('9')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">9</button>
                    <button onclick="pressNumpad('C')" class="bg-red-100 text-red-600 py-2 rounded-lg font-bold text-sm cursor-pointer">C</button>
                    <button onclick="pressNumpad('4')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">4</button>
                    <button onclick="pressNumpad('5')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">5</button>
                    <button onclick="pressNumpad('6')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">6</button>
                    <button onclick="pressNumpad('DEL')" class="bg-slate-200 text-slate-700 py-2 rounded-lg font-bold text-sm cursor-pointer"><i class="fa-solid fa-delete-left"></i></button>
                    <button onclick="pressNumpad('1')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">1</button>
                    <button onclick="pressNumpad('2')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">2</button>
                    <button onclick="pressNumpad('3')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">3</button>
                    <button onclick="pressNumpad('00')" class="bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">00</button>
                    <button onclick="pressNumpad('0')" class="col-span-2 bg-white py-2 rounded-lg font-bold text-sm shadow-sm border border-slate-200 cursor-pointer">0</button>
                    <button onclick="pressNumpad('50000')" class="bg-red-50 text-red-600 py-2 rounded-lg font-bold text-xs border border-red-200 cursor-pointer">50rb</button>
                    <button onclick="pressNumpad('100000')" class="bg-red-50 text-red-600 py-2 rounded-lg font-bold text-xs border border-red-200 cursor-pointer">100rb</button>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-slate-200">
                <button onclick="checkout()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-red-200 transition text-base flex justify-center items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wallet"></i> Selesaikan Transaksi
                </button>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx32HF0ruWN_JaiJk6KD6EqmHXmVFnRq80DQFENgN0AMnyGXdbJWcwBbPMrQe8AaV9n/exec";

        let products = [];
        let cart = [];
        let numpadValue = "0";
        let html5QrCode = null;

        document.getElementById('cashier-name').innerText = activeUser.nama_lengkap;
        document.getElementById('cashier-initial').innerText = activeUser.nama_lengkap.charAt(0).toUpperCase();

        function logout() {
            localStorage.removeItem('ritel_active_user');
            window.location.href = 'index.html';
        }

        // Fungsi Navigasi Home pintar (Jika Admin balik ke admin.html, jika Kasir kembali ke index.html)
        function goHome() {
            if (activeUser.role === 'Admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        async function loadProducts() {
            try {
                let res = await fetch(`${API_URL}?action=getProducts`);
                products = await res.json();
                renderProducts(products);
            } catch (err) {
                products = [
                    { Barcode: 101, "Nama Barang": "Nasi Goreng Spesial Instan", Kategori: "Makanan", "Harga Jual": 15000, Stok: 45, Ikon: "fa-bowl-rice" },
                    { Barcode: 102, "Nama Barang": "Minyak Goreng Bimoli 2L", Kategori: "Sembako", "Harga Jual": 38000, Stok: 12, Ikon: "fa-bottle-droplet" },
                    { Barcode: 103, "Nama Barang": "Air Mineral Aqua 600ml", Kategori: "Minuman", "Harga Jual": 3500, Stok: 150, Ikon: "fa-bottle-water" }
                ];
                renderProducts(products);
            }
        }

        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-12 text-slate-400 text-sm">Produk tidak ditemukan.</div>`;
                return;
            }
            list.forEach(p => {
                grid.innerHTML += `
                    <div onclick="addToCart('${p.Barcode}')" class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:border-red-500 cursor-pointer transition flex flex-col justify-between group">
                        <div>
                            <div class="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-xl mb-3 group-hover:bg-red-600 group-hover:text-white transition">
                                <i class="fa-solid ${p.Ikon || 'fa-box'}"></i>
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm line-clamp-2">${p["Nama Barang"]}</h3>
                        </div>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="font-extrabold text-red-600 text-sm">Rp ${Number(p["Harga Jual"]).toLocaleString('id-ID')}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full ${p.Stok > 10 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}">Stok: ${p.Stok}</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => String(p["Nama Barang"]).toLowerCase().includes(q) || String(p.Barcode).toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function startScanner() {
            document.getElementById('reader-container').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 140 } },
                (decodedText) => {
                    addToCart(decodedText);
                    stopScanner();
                },
                () => {}
            ).catch(() => {
                alert("Gagal membuka kamera. Izinkan akses kamera di browser.");
                document.getElementById('reader-container').classList.add('hidden');
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('reader-container').classList.add('hidden');
                });
            } else {
                document.getElementById('reader-container').classList.add('hidden');
            }
        }

        function addToCart(id) {
            const p = products.find(x => String(x.Barcode) === String(id));
            if (!p) {
                alert(`Barang dengan Barcode "${id}" tidak ditemukan!`);
                return;
            }
            if (p.Stok <= 0) {
                alert(`Stok ${p["Nama Barang"]} habis!`);
                return;
            }

            let item = cart.find(x => String(x.Barcode) === String(id));
            if (item) {
                if (item.qty < p.Stok) item.qty++;
                else alert('Stok tidak mencukupi!');
            } else {
                cart.push({ ...p, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-count');
            container.innerHTML = '';
            let totalQty = 0;
            let subtotal = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-6 text-sm">Keranjang masih kosong.</p>`;
                badge.innerText = `0 Item`;
                document.getElementById('display-total').innerText = `Rp 0`;
                document.getElementById('display-cash').innerText = `Rp 0`;
                document.getElementById('display-change').innerText = `Rp 0`;
                return;
            }

            cart.forEach((item, idx) => {
                totalQty += item.qty;
                subtotal += Number(item["Harga Jual"]) * item.qty;
                container.innerHTML += `
                    <div class="py-2 flex justify-between items-center text-sm">
                        <div class="flex-1 pr-2">
                            <h4 class="font-bold text-slate-800 text-xs">${item["Nama Barang"]}</h4>
                            <span class="text-xs text-slate-400">Rp ${Number(item["Harga Jual"]).toLocaleString('id-ID')} x ${item.qty}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-red-600 text-xs">Rp ${(Number(item["Harga Jual"]) * item.qty).toLocaleString('id-ID')}</span>
                            <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                                <button onclick="changeQty(${idx}, -1)" class="px-2 py-0.5 hover:bg-slate-200 text-xs font-bold cursor-pointer">-</button>
                                <span class="px-2 text-xs font-bold">${item.qty}</span>
                                <button onclick="changeQty(${idx}, 1)" class="px-2 py-0.5 hover:bg-slate-200 text-xs font-bold cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            badge.innerText = `${totalQty} Item`;
            calculatePayment(subtotal);
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            renderCart();
        }

        function pressNumpad(val) {
            if (val === 'C') numpadValue = "0";
            else if (val === 'DEL') numpadValue = numpadValue.length > 1 ? numpadValue.slice(0, -1) : "0";
            else if (val === '50000' || val === '100000') numpadValue = val;
            else numpadValue = numpadValue === "0" ? val : numpadValue + val;
            
            document.getElementById('numpad-display').innerText = parseInt(numpadValue).toLocaleString('id-ID');
            let subtotal = cart.reduce((sum, i) => sum + (Number(i["Harga Jual"]) * i.qty), 0);
            calculatePayment(subtotal);
        }

        function calculatePayment(subtotal) {
            let cash = parseInt(numpadValue) || 0;
            let change = cash - subtotal;
            document.getElementById('display-total').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
            document.getElementById('display-cash').innerText = `Rp ${cash.toLocaleString('id-ID')}`;
            const changeEl = document.getElementById('display-change');
            if (change >= 0) {
                changeEl.innerText = `Rp ${change.toLocaleString('id-ID')}`;
                changeEl.className = "text-emerald-600 font-extrabold";
            } else {
                changeEl.innerText = `Kurang Rp ${Math.abs(change).toLocaleString('id-ID')}`;
                changeEl.className = "text-red-600 font-extrabold";
            }
        }

        async function checkout() {
            if (cart.length === 0) return alert('Keranjang kosong!');
            let subtotal = cart.reduce((sum, i) => sum + (Number(i["Harga Jual"]) * i.qty), 0);
            let cash = parseInt(numpadValue) || 0;
            if (cash < subtotal) return alert('Uang pembayaran kurang!');

            let change = cash - subtotal;

            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "checkout", items: cart.map(i => ({ id: i.Barcode, qty: i.qty })) })
                });
            } catch (e) {}

            let triggerDrawer = confirm(
                `TRANSAKSI BERHASIL!\n\n` +
                `Total Belanja: Rp ${subtotal.toLocaleString('id-ID')}\n` +
                `Uang Dibayar: Rp ${cash.toLocaleString('id-ID')}\n` +
                `Kembalian: Rp ${change.toLocaleString('id-ID')}\n\n` +
                `[ 🗄️ CASH DRAWER ] Klik OK untuk mencetak struk dan membuka laci uang.`
            );

            if (triggerDrawer) {
                window.print();
            }

            cart = [];
            numpadValue = "0";
            document.getElementById('numpad-display').innerText = "0";
            loadProducts();
            renderCart();
        }

        loadProducts();
    </script>
</body>
</html>
