<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DELAPAN KOSONG LIMA MART</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <div class="brand">
        <div class="brand-mark">805</div>

        <h1>DELAPAN KOSONG LIMA</h1>
        <p>MART</p>
      </div>


      <div class="login-form">

        <label for="name">
          Nama Pengguna
        </label>

        <input
          type="text"
          id="name"
          placeholder="Masukkan nama pengguna"
          autocomplete="username"
        >


        <label for="pin">
          PIN
        </label>

        <input
          type="password"
          id="pin"
          placeholder="6 digit PIN"
          maxlength="6"
          inputmode="numeric"
          autocomplete="current-password"
        >


        <button
          id="loginButton"
          type="button"
          onclick="login()"
        >
          MASUK
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </div>

    </div>

  </main>


  <script src="app.js"></script>

</body>
</html>
