<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Terminal - 805 Mart Manado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-800 h-screen w-screen flex items-center justify-center p-4 antialiased overflow-hidden m-0">
    
    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl border border-slate-100 space-y-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-2 bg-red-600"></div>

        <div class="text-center space-y-2 pt-2">
            <div class="flex justify-center items-center">
                <img src="Logo.png" alt="Logo 805 Mart" class="w-44 h-auto object-contain drop-shadow-md" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=805+Mart';">
            </div>
            <div class="space-y-1">
                <h2 class="text-base font-extrabold text-slate-800 tracking-wide">PORTAL KASIR & MANAJEMEN</h2>
                <p class="text-xs text-slate-400 font-medium">Silakan masuk untuk mengakses terminal sistem</p>
            </div>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username / ID Pengguna</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Contoh: kasir, admin, owner" 
                        class="w-full bg-slate-50 pl-11 pr-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-600 text-sm font-bold text-slate-800">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">PIN / Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" required placeholder="Masukkan PIN keamanan..." 
                        class="w-full bg-slate-50 pl-11 pr-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-600 text-sm font-bold text-slate-800">
                </div>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-2xl font-extrabold shadow-xl shadow-red-200 transition text-sm flex justify-center items-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-right-to-bracket text-base"></i> Masuk Terminal Sistem
            </button>
        </form>

        <div class="text-center pt-3 border-t border-slate-100 flex flex-col items-center space-y-1">
            <div class="flex items-center gap-1.5 text-emerald-600 text-[11px] font-bold bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Google Sheets Cloud Connected</span>
            </div>
            <p class="text-[10px] text-slate-400 font-medium">Ruko Amethys A568 Kompleks Kawanua Emerald City Manado</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzvMndS6Q0_jx-9_3XMcreaMUKtbUNIft2gOJ4i3YUBL8rUwD4m418LdIxC0jM8DNCA/exec";
        localStorage.removeItem('ritel_active_user');

        function handleLogin(e) {
            e.preventDefault();
            let userVal = document.getElementById('username').value.trim().toLowerCase();
            let passVal = document.getElementById('password').value.trim();

            if (!userVal || !passVal) {
                alert("Username dan PIN wajib diisi!");
                return;
            }

            let role = "Kasir";
            if (userVal === 'admin') role = "Admin";
            else if (userVal === 'owner') role = "Owner";

            let userData = {
                nama_lengkap: userVal.charAt(0).toUpperCase() + userVal.slice(1),
                role: role
            };

            localStorage.setItem('ritel_active_user', JSON.stringify(userData));

            if (role === 'Admin') window.location.href = 'admin.html';
            else if (role === 'Owner') window.location.href = 'owner.html';
            else window.location.href = 'kasir.html';
        }
    </script>
</body>
</html>
